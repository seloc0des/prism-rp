name: Prism RP Release

# Builds every binary listed in addons/prism_rp/prism_rp.gdextension, packages the addon,
# and publishes it. A tag like v0.2.0 creates a GitHub release; a manual run only uploads
# the zip as a workflow artifact (handy for testing the packaging).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # windows arm64 is an MSVC cross-compile on the x64 runner.
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x86_64, target: template_debug }
          - { os: ubuntu-24.04, platform: linux, arch: x86_64, target: template_release }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, target: template_debug }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64, target: template_release }
          - { os: windows-latest, platform: windows, arch: x86_64, target: template_debug }
          - { os: windows-latest, platform: windows, arch: x86_64, target: template_release }
          - { os: windows-latest, platform: windows, arch: arm64, target: template_debug }
          - { os: windows-latest, platform: windows, arch: arm64, target: template_release }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the submodules this job builds against
        run: git submodule update --init --depth 1 thirdparty/godot-cpp thirdparty/meshoptimizer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SCons
        run: pip install scons

      - name: Compile
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ matrix.target }} -j4

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}
          path: |
            addons/prism_rp/bin/*.so
            addons/prism_rp/bin/*.dll
          if-no-files-found: error

  package:
    name: Package addon
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: addons/prism_rp/bin
          merge-multiple: true

      - name: Check every .gdextension library is present
        run: |
          set -euo pipefail
          missing=0
          for lib in $(grep -oE 'res://addons/prism_rp/bin/[^"]+' addons/prism_rp/prism_rp.gdextension); do
            file="${lib#res://}"
            if [ ! -f "$file" ]; then echo "::error::missing $file"; missing=1; fi
          done
          exit $missing

      - name: Build zip
        id: zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-${GITHUB_SHA::8}"
          NAME="prism_rp-${VERSION}.zip"
          cp LICENSE README.md addons/prism_rp/
          rm -f addons/prism_rp/bin/.gitkeep
          zip -r "$NAME" addons/prism_rp -x '*.gitkeep'
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism_rp-addon
          path: ${{ steps.zip.outputs.name }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.zip.outputs.name }}" --generate-notes --verify-tag
