name: Prism RP CI — SPIR-V, C++20 GDExtension & Vulkan QA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch / PR cancels the run in progress: only the latest commit's
# results matter, and stale runs otherwise queue up and starve each other of runners.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  PYTHON_VERSION: "3.11"

jobs:
  validate-shaders:
    name: Validate GLSL 4.60 -> Vulkan 1.3 SPIR-V
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install glslang-tools and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Compile and validate all shaders
        run: |
          set -euo pipefail
          mkdir -p build/spirv
          SHADER_COUNT=0

          while IFS= read -r -d '' shader; do
            SHADER_COUNT=$((SHADER_COUNT + 1))
            filename=$(basename "$shader")

            case "$filename" in
              *.comp.glsl) stage="comp" ;;
              *.vert.glsl) stage="vert" ;;
              *.frag.glsl) stage="frag" ;;
              *.mesh.glsl) stage="mesh" ;;
              *.task.glsl) stage="task" ;;
              *)
                echo "::error file=$shader::Invalid shader suffix. Expected .<stage>.glsl"
                exit 1
                ;;
            esac

            out_spv="build/spirv/${filename}.spv"
            echo "Validating [$stage]: $shader"
            glslangValidator -V --target-env vulkan1.3 -S "$stage" \
              -Iaddons/prism_rp/shaders/include \
              "$shader" -o "$out_spv"

            spirv-val --target-env vulkan1.3 "$out_spv"
          done < <(find addons/prism_rp/shaders -type f -name "*.glsl" -not -path "*/include/*" -print0)

          echo "Successfully validated $SHADER_COUNT shader(s)."

      - name: Upload compiled SPIR-V binaries
        uses: actions/upload-artifact@v4
        with:
          name: prism-rp-spirv
          path: build/spirv/*.spv
          if-no-files-found: error

  unit-tests:
    name: Python unit tests (harness, push-constant layouts, GDScript API names)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the submodules this job builds against
        run: git submodule update --init --depth 1 thirdparty/godot-cpp thirdparty/meshoptimizer   # godot-cpp: the GDScript API-name test reads its API dump

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install glslang and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          pip install pytest pyyaml flip-evaluator numpy pillow

      - name: Run unit tests
        run: python -m pytest tests/unit -v

  shader-tests:
    name: Compute shader tests on lavapipe (numeric checks, validation layers on)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lavapipe, Vulkan dev headers, validation layers and glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers vulkan-tools libvulkan-dev nlohmann-json3-dev glslang-tools g++
          pip install pytest numpy
          ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"

      - name: Run shader tests
        run: |
          vulkaninfo --summary | grep -E "deviceName|apiVersion"
          python -m pytest tests/shader_harness -v

  reference-renderer:
    name: Gate 2 reference pipeline (Blender Cycles, synthetic Cornell box)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender
          python3 -m pip install pytest numpy OpenEXR
          blender --version | head -1

      - name: Render and check the reference
        run: python3 -m pytest tests/reference -v

  build-gdextension:
    name: Build C++20 (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: template_debug
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: template_release
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: template_debug
          # macOS dropped for now (not a target; the CMake/SCons scripts still support it).

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the submodules this job builds against
        run: git submodule update --init --depth 1 thirdparty/godot-cpp thirdparty/meshoptimizer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SCons
        run: pip install scons

      - name: Resolve godot-cpp submodule commit
        id: godot_cpp
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:thirdparty/godot-cpp)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp build artifacts
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/godot-cpp/bin
            thirdparty/godot-cpp/gen
          key: godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ steps.godot_cpp.outputs.sha }}

      # CMake builds first: they write to the same bin/ path, and the uploaded artifact should be
      # the SCons build that follows.
      - name: Verify CMake C++20 build (Linux, with shader validation)
        if: matrix.platform == 'linux' && matrix.target == 'template_debug'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools
          cmake -B build_cmake -G Ninja -DGODOT_TARGET=template_debug -DPRISM_RP_VALIDATE_SHADERS=ON
          cmake --build build_cmake -j4

      - name: Verify CMake C++20 build (Windows)
        if: matrix.platform != 'linux' && matrix.target == 'template_debug'
        shell: bash
        run: |
          cmake -B build_cmake -DGODOT_TARGET=template_debug -DPRISM_RP_VALIDATE_SHADERS=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_cmake --config Debug -j 4

      - name: Compile Prism RP via SCons (C++20)
        run: |
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ matrix.target }} -j4

      - name: Upload GDExtension binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-rp-${{ matrix.platform }}-${{ matrix.target }}
          path: addons/prism_rp/bin/*
          if-no-files-found: error

  gpu-session-software:
    name: GPU session script on lavapipe (software mode, motion-vector check)
    needs: [build-gdextension]
    # Only the Linux debug binary is needed; the download fails if Linux didn't build.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux debug GDExtension binary
        uses: actions/download-artifact@v4
        with:
          name: prism-rp-linux-template_debug
          path: addons/prism_rp/bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lavapipe, validation layers, Xvfb and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb
          pip install numpy pillow flip-evaluator OpenEXR

      # The same script you run on a GPU machine, reduced to one scene and no Gate 1/2 or HDR step
      # (the GI settling check runs).
      # It downloads Godot itself, so that path is tested too.
      - name: Run the GPU session in software mode
        run: python3 tests/gpu_session.py --software --skip-build --non-interactive

      - name: Upload the session package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-session-software
          path: |
            tests/artifacts/gpu_session/gpu_session_*.zip
            tests/artifacts/gpu_session/*/session.json
          if-no-files-found: warn

  gate2-software:
    name: Gate 2 on lavapipe (Lumina vs Cycles, report only)
    needs: [build-gdextension]
    # Measures Lumina against the Cycles reference without a GPU, so Lumina can be improved and
    # checked remotely. Report only: it fails on crashes, not on the PSNR (Gate 2 is judged on a GPU).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux debug GDExtension binary
        uses: actions/download-artifact@v4
        with:
          name: prism-rp-linux-template_debug
          path: addons/prism_rp/bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lavapipe, Xvfb, Blender and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb wget unzip blender
          pip install numpy pillow flip-evaluator OpenEXR
          blender --version | head -1

      - name: Download Godot ${{ env.GODOT_VERSION }} Linux binary
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Link addon into QA project and import it
        run: |
          mkdir -p project/addons
          rm -rf project/addons/prism_rp
          ln -s "$(pwd)/addons/prism_rp" "$(pwd)/project/addons/prism_rp"
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path project --import > godot_import.log 2>&1 || true
          test -f project/.godot/extension_list.cfg

      - name: Run Gate 2 on lavapipe
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          python3 tests/run_gate2.py --tier tier1 --samples 128 --report-only --noise-check \
            --godot-bin "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --out-dir tests/artifacts/gate2_ci

      - name: Upload the comparison images and numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-software
          path: |
            tests/artifacts/gate2_ci/gate2.json
            tests/artifacts/gate2_ci/*/compare.png
            tests/artifacts/gate2_ci/*/compare_sdfgi.png
            tests/artifacts/gate2_ci/*/reference_full.png
            tests/artifacts/gate2_ci/*/blender.log
            tests/artifacts/gate2_ci/*/godot/godot.log
          if-no-files-found: warn

  export-check:
    name: Exported games (Linux run on lavapipe, Windows packaging)
    needs: [build-gdextension]
    # Prism RP in a release export, as a game ships: the Linux export runs on lavapipe; the Windows
    # export (DLL cross-compiled with MinGW-w64) is checked for packaging only, since there is no
    # Windows GPU here. The GPU session runs both on real hardware (Windows through Wine).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the submodules this job builds against
        run: git submodule update --init --depth 1 thirdparty/godot-cpp thirdparty/meshoptimizer

      - name: Download Linux release GDExtension binary
        uses: actions/download-artifact@v4
        with:
          name: prism-rp-linux-template_release
          path: addons/prism_rp/bin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lavapipe, Xvfb, MinGW-w64 and SCons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb wget unzip g++-mingw-w64-x86-64-posix
          pip install scons

      - name: Cross-compile the Windows release DLL
        run: scons platform=windows use_mingw=yes target=template_release arch=x86_64 -j4

      - name: Download Godot ${{ env.GODOT_VERSION }} Linux binary
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-export-templates-${{ env.GODOT_VERSION }}

      - name: Export and run
        run: |
          export VK_DRIVER_FILES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          python3 tests/check_export.py --godot-bin "$(pwd)/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --download-templates --skip-build --no-run windows --out-dir tests/artifacts/export_check

      - name: Upload the export check's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-check
          path: |
            tests/artifacts/export_check/*.json
            tests/artifacts/export_check/*.log
            tests/artifacts/export_check/run_*/game.log
            tests/artifacts/export_check/run_*/captured.png
          if-no-files-found: warn

  vulkan-qa:
    name: Vulkan Validation Layer Smoke Test (lavapipe)
    needs: [validate-shaders, build-gdextension]
    # Only the Linux debug binary is needed: run even if another platform's build failed or was
    # cancelled. The artifact download fails if Linux didn't build.
    if: ${{ !cancelled() && needs.validate-shaders.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux debug GDExtension binary
        uses: actions/download-artifact@v4
        with:
          name: prism-rp-linux-template_debug
          path: addons/prism_rp/bin

      - name: Install Mesa Lavapipe (Vulkan 1.3), Khronos Validation Layers & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb wget unzip

      - name: Download Godot ${{ env.GODOT_VERSION }} Linux binary
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Link addon into QA project and import it
        run: |
          mkdir -p project/addons
          rm -rf project/addons/prism_rp   # replace anything stale, e.g. a link committed from another machine
          ln -s "$(pwd)/addons/prism_rp" "$(pwd)/project/addons/prism_rp"
          # The import pass writes .godot/extension_list.cfg; without it the GDExtension is never loaded.
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path project --import 2>&1 | tee godot_import.log
          test -f project/.godot/extension_list.cfg

      - name: Locate the lavapipe ICD and check Vulkan works under Xvfb
        run: |
          # Mesa 25+ ships lvp_icd.json; older releases used lvp_icd.<arch>.json.
          ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$ICD" xvfb-run -a vulkaninfo --summary

      - name: Boot every benchmark scene on Vulkan with validation layers
        env:
          VK_INSTANCE_LAYERS: "VK_LAYER_KHRONOS_validation"
        run: |
          set -o pipefail
          GODOT=./Godot_v${GODOT_VERSION}-stable_linux.x86_64
          SCENES="01_cornell_box 02_foliage_overdraw 03_thin_geometry_aliasing 04_dynamic_sponza 05_volumetrics_wboit"

          run_scenes() {  # $1 = log file, remaining = rig user args
            local log="$1"; shift
            : > "$log"
            for scene in $SCENES; do
              echo "=== ${scene}" | tee -a "$log"
              # Not --headless: headless forces the dummy renderer, so Vulkan would never start.
              xvfb-run -a -s "-screen 0 1280x720x24" \
                "$GODOT" --rendering-driver vulkan --path project --fixed-fps 60 \
                  "res://benchmarks/${scene}.tscn" --quit-after 30 -- "$@" 2>&1 | tee -a "$log"
            done
          }

          # Baseline first: same scenes with every Prism RP effect off. Anything it reports comes
          # from Godot, Mesa or the validation layers themselves, not from this repository.
          run_scenes godot_baseline.log --prism-chronos=off --prism-lumina=off
          run_scenes godot_vulkan_qa.log

          # Godot silently falls back to OpenGL when Vulkan fails; that must not pass as a Vulkan run.
          if grep -q "switching to OpenGL" godot_vulkan_qa.log || ! grep -q "Forward+ - Using Device" godot_vulkan_qa.log; then
            echo "::error::Godot did not run on Vulkan Forward+."
            exit 1
          fi
          if ! grep -q "\[Prism RP\] Registered" godot_vulkan_qa.log; then
            echo "::error::Prism RP GDExtension did not register (extension not loaded)."
            exit 1
          fi

          # Always fatal, baseline or not.
          if grep -E "SCRIPT ERROR|Parse Error|Can't open dynamic library|Failed to retrieve non-existent singleton|\[Prism RP\].*([Ff]ailed|FAILED|not found)" godot_vulkan_qa.log; then
            echo "::error::Script, GDExtension or Prism RP errors detected!"
            exit 1
          fi

          # Validation IDs and engine ERROR lines: fatal only if Prism RP introduced them.
          extract() { { grep -oE "VUID-[A-Za-z0-9_-]+|SYNC-HAZARD-[A-Z_-]+" "$1"; grep -E "^ERROR: " "$1"; } | LC_ALL=C sort -u; }
          extract godot_baseline.log > baseline_findings.txt || true
          extract godot_vulkan_qa.log > prism_findings.txt || true
          echo "--- present in baseline too (not ours):"; LC_ALL=C comm -12 baseline_findings.txt prism_findings.txt
          LC_ALL=C comm -13 baseline_findings.txt prism_findings.txt > new_findings.txt
          if [ -s new_findings.txt ]; then
            echo "::error::Vulkan validation / engine errors introduced by Prism RP:"
            cat new_findings.txt
            exit 1
          fi

      - name: Upload Vulkan QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-vulkan-qa-log
          path: godot_*.log
