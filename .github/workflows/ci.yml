name: Prism RP CI — SPIR-V, C++20 GDExtension & Vulkan QA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GODOT_VERSION: "4.4.1"
  PYTHON_VERSION: "3.11"

jobs:
  validate-shaders:
    name: Validate GLSL 4.60 -> Vulkan 1.3 SPIR-V
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install glslang-tools and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Compile and validate all shaders
        run: |
          set -euo pipefail
          mkdir -p build/spirv
          SHADER_COUNT=0

          while IFS= read -r -d '' shader; do
            SHADER_COUNT=$((SHADER_COUNT + 1))
            filename=$(basename "$shader")

            case "$filename" in
              *.comp.glsl) stage="comp" ;;
              *.vert.glsl) stage="vert" ;;
              *.frag.glsl) stage="frag" ;;
              *.mesh.glsl) stage="mesh" ;;
              *.task.glsl) stage="task" ;;
              *)
                echo "::error file=$shader::Invalid shader suffix. Expected .<stage>.glsl"
                exit 1
                ;;
            esac

            out_spv="build/spirv/${filename}.spv"
            echo "Validating [$stage]: $shader"
            glslangValidator -V --target-env vulkan1.3 -S "$stage" \
              -Iaddons/prism_rp/shaders/include \
              "$shader" -o "$out_spv"

            spirv-val --target-env vulkan1.3 "$out_spv"
          done < <(find addons/prism_rp/shaders -type f -name "*.glsl" -not -path "*/include/*" -print0)

          echo "Successfully validated $SHADER_COUNT shader(s)."

      - name: Upload compiled SPIR-V binaries
        uses: actions/upload-artifact@v4
        with:
          name: prism-rp-spirv
          path: build/spirv/*.spv
          if-no-files-found: error

  build-gdextension:
    name: Build C++20 (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: template_debug
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            target: template_release
          - os: windows-latest
            platform: windows
            arch: x86_64
            target: template_debug
          - os: macos-latest
            platform: macos
            arch: universal
            target: template_debug

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install SCons
        run: pip install scons

      - name: Resolve godot-cpp submodule commit
        id: godot_cpp
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:thirdparty/godot-cpp)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp build artifacts
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/godot-cpp/bin
            thirdparty/godot-cpp/gen
          key: godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.target }}-${{ steps.godot_cpp.outputs.sha }}

      - name: Compile Prism RP via SCons (C++20)
        run: |
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=${{ matrix.target }} -j4

      - name: Verify CMake C++20 configuration (Linux)
        if: matrix.platform == 'linux' && matrix.target == 'template_debug'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build glslang-tools
          cmake -B build_cmake -G Ninja -DGODOT_TARGET=template_debug -DPRISM_RP_VALIDATE_SHADERS=ON
          cmake --build build_cmake -j4

      - name: Upload GDExtension binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-rp-${{ matrix.platform }}-${{ matrix.target }}
          path: addons/prism_rp/bin/*
          if-no-files-found: error

  vulkan-qa:
    name: Vulkan Validation Layer Smoke Test (lavapipe)
    needs: [validate-shaders, build-gdextension]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux debug GDExtension binary
        uses: actions/download-artifact@v4
        with:
          name: prism-rp-linux-template_debug
          path: addons/prism_rp/bin

      - name: Install Mesa Lavapipe (Vulkan 1.3), Khronos Validation Layers & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb wget unzip

      - name: Download Godot ${{ env.GODOT_VERSION }} Linux binary
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64

      - name: Link addon into QA project and import it
        run: |
          mkdir -p project/addons
          ln -s "$(pwd)/addons/prism_rp" "$(pwd)/project/addons/prism_rp"
          # The import pass writes .godot/extension_list.cfg; without it the GDExtension is never loaded.
          ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path project --import 2>&1 | tee godot_import.log
          test -f project/.godot/extension_list.cfg

      - name: Boot every benchmark scene on Vulkan with validation layers
        env:
          VK_INSTANCE_LAYERS: "VK_LAYER_KHRONOS_validation"
          VK_DRIVER_FILES: "/usr/share/vulkan/icd.d/lvp_icd.x86_64.json"
        run: |
          set -o pipefail
          : > godot_vulkan_qa.log
          for scene in 01_cornell_box 02_foliage_overdraw 03_thin_geometry_aliasing 04_dynamic_sponza 05_volumetrics_wboit; do
            echo "=== ${scene}" | tee -a godot_vulkan_qa.log
            # Not --headless: headless forces the dummy renderer, so Vulkan would never start.
            xvfb-run -a -s "-screen 0 1280x720x24" \
              ./Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
                --rendering-driver vulkan \
                --path project \
                --fixed-fps 60 \
                "res://benchmarks/${scene}.tscn" \
                --quit-after 30 2>&1 | tee -a godot_vulkan_qa.log
          done

          if ! grep -q "\[Prism RP\] Registered" godot_vulkan_qa.log; then
            echo "::error::Prism RP GDExtension did not register (extension not loaded)."
            exit 1
          fi
          if grep -E "VUID-|Validation Error|SYNC-HAZARD|Can't open dynamic library|SCRIPT ERROR|Parse Error|\[Prism RP\].*([Ff]ailed|FAILED|not found)" godot_vulkan_qa.log; then
            echo "::error::Vulkan validation, script, or GDExtension errors detected!"
            exit 1
          fi

      - name: Upload Vulkan QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-vulkan-qa-log
          path: godot_*.log
