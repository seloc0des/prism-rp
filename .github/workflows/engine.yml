name: Custom Godot engine

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "engine/**"
      - "addons/prism_rp/shaders/**"
      - "addons/prism_rp/src/meshlet/**"
      - "addons/prism_rp/include/**"
      - "tests/run_vulkan_qa.sh"
      - "tests/engine/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-check:
    name: Engine patches apply
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply the patch set to the pinned Godot
        run: python3 engine/apply_patches.py

  linux-editor:
    name: Linux editor
    needs: patch-check
    runs-on: ubuntu-24.04
    env:
      # Keeps the SCons cache well under the repository's 10 GB cache budget; Godot prunes to this on exit.
      CACHE_LIMIT_GIB: "3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot's Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libdbus-1-dev libfontconfig-dev libspeechd-dev
          python3 -m venv .venv
          .venv/bin/pip install scons

      - name: Read the pinned Godot commit
        id: pin
        run: echo "godot=$(git rev-parse HEAD:engine/godot)" >> "$GITHUB_OUTPUT"

      - name: Restore the SCons cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-${{ runner.os }}-editor-${{ steps.pin.outputs.godot }}-${{ hashFiles('engine/patches/**', 'engine/modules/**') }}
          restore-keys: |
            scons-${{ runner.os }}-editor-${{ steps.pin.outputs.godot }}-
            scons-${{ runner.os }}-editor-

      - name: Build the editor
        run: python3 engine/build.py platform=linuxbsd target=editor cache_path="${{ runner.temp }}/scons-cache" cache_limit="$CACHE_LIMIT_GIB"

      - name: Check the version and the module log line
        run: |
          set -euo pipefail
          EDITOR=engine/godot/bin/godot.linuxbsd.editor.x86_64
          "$EDITOR" --headless --version | tee version.txt
          grep -q "prism" version.txt
          "$EDITOR" --headless --quit | tee run.txt
          grep -qF "[Prism RP] engine module loaded" run.txt

      # Only main writes the cache, so pull requests cannot fill the 10 GB budget with per-commit entries.
      - name: Save the SCons cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-${{ runner.os }}-editor-${{ steps.pin.outputs.godot }}-${{ hashFiles('engine/patches/**', 'engine/modules/**') }}

      - name: Upload the editor binary
        uses: actions/upload-artifact@v4
        with:
          name: prism-godot-linux-editor
          path: engine/godot/bin/godot.linuxbsd.editor.x86_64
          if-no-files-found: error
          retention-days: 7

  templates:
    name: ${{ matrix.name }} template
    needs: patch-check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-release
            scons: platform=linuxbsd target=template_release
            binary: godot.linuxbsd.template_release.x86_64
            file_pattern: 'ELF 64-bit LSB.*x86-64'
            cache_limit_gib: "1"
          - name: linux-debug
            scons: platform=linuxbsd target=template_debug
            binary: godot.linuxbsd.template_debug.x86_64
            file_pattern: 'ELF 64-bit LSB.*x86-64'
            cache_limit_gib: "1"
          - name: windows-release
            scons: platform=windows use_mingw=yes d3d12=no target=template_release
            binary: godot.windows.template_release.x86_64.exe
            file_pattern: 'PE32\+ executable.*x86-64'
            cache_limit_gib: "1"
          - name: windows-debug
            scons: platform=windows use_mingw=yes d3d12=no target=template_debug
            binary: godot.windows.template_debug.x86_64.exe
            file_pattern: 'PE32\+ executable.*x86-64'
            cache_limit_gib: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Linux build dependencies
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev libdbus-1-dev libfontconfig-dev libspeechd-dev

      - name: Install MinGW-w64
        if: startsWith(matrix.name, 'windows')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix
          # Godot calls the unsuffixed names, and Ubuntu defaults them to the win32 thread model.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install SCons
        run: |
          python3 -m venv .venv
          .venv/bin/pip install scons

      - name: Read the pinned Godot commit
        id: pin
        run: echo "godot=$(git rev-parse HEAD:engine/godot)" >> "$GITHUB_OUTPUT"

      - name: Restore the SCons cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-${{ runner.os }}-${{ matrix.name }}-${{ steps.pin.outputs.godot }}-${{ hashFiles('engine/patches/**', 'engine/modules/**') }}
          restore-keys: |
            scons-${{ runner.os }}-${{ matrix.name }}-${{ steps.pin.outputs.godot }}-
            scons-${{ runner.os }}-${{ matrix.name }}-

      - name: Build the template
        run: python3 engine/build.py ${{ matrix.scons }} cache_path="${{ runner.temp }}/scons-cache" cache_limit="${{ matrix.cache_limit_gib }}"

      - name: Check the binary
        run: |
          set -euo pipefail
          BIN=engine/godot/bin/${{ matrix.binary }}
          file "$BIN" | tee file.txt
          grep -qE '${{ matrix.file_pattern }}' file.txt
          if [[ "${{ matrix.name }}" == linux-* ]]; then
            "$BIN" --headless --version | tee version.txt
            grep -q prism version.txt
          fi

      # Only main writes the cache, so pull requests cannot fill the 10 GB budget with per-commit entries.
      - name: Save the SCons cache
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-${{ runner.os }}-${{ matrix.name }}-${{ steps.pin.outputs.godot }}-${{ hashFiles('engine/patches/**', 'engine/modules/**') }}

      - name: Upload the template
        uses: actions/upload-artifact@v4
        with:
          name: prism-godot-${{ matrix.name }}
          path: engine/godot/bin/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  vulkan-qa:
    name: Vulkan QA on the custom editor (lavapipe)
    needs: linux-editor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the submodules the GDExtension builds against
        run: git submodule update --init --depth 1 thirdparty/godot-cpp thirdparty/meshoptimizer

      - name: Download the custom editor
        uses: actions/download-artifact@v4
        with:
          name: prism-godot-linux-editor
          path: custom-editor

      - name: Install Mesa Lavapipe, Khronos Validation Layers, Xvfb and SCons
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb build-essential python3-venv
          python3 -m venv .venv
          .venv/bin/pip install scons
          chmod +x custom-editor/godot.linuxbsd.editor.x86_64

      - name: Resolve godot-cpp submodule commit
        id: godot_cpp
        run: echo "sha=$(git rev-parse HEAD:thirdparty/godot-cpp)" >> "$GITHUB_OUTPUT"

      # Same key as the GDExtension build in ci.yml, so the two workflows share one godot-cpp cache.
      - name: Cache godot-cpp build artifacts
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/godot-cpp/bin
            thirdparty/godot-cpp/gen
          key: godot-cpp-linux-x86_64-template_debug-${{ steps.godot_cpp.outputs.sha }}

      - name: Build the GDExtension
        run: .venv/bin/scons platform=linux arch=x86_64 target=template_debug -j4

      - name: Link addon into QA project and import it
        run: |
          mkdir -p project/addons
          rm -rf project/addons/prism_rp
          ln -s "$(pwd)/addons/prism_rp" "$(pwd)/project/addons/prism_rp"
          # The import pass writes .godot/extension_list.cfg; without it the GDExtension is never loaded.
          custom-editor/godot.linuxbsd.editor.x86_64 --headless --path project --import 2>&1 | tee godot_import.log
          test -f project/.godot/extension_list.cfg

      - name: Locate the lavapipe ICD and check Vulkan works under Xvfb
        run: |
          ICD="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$ICD" xvfb-run -a vulkaninfo --summary

      - name: Boot every benchmark scene on Vulkan with validation layers
        run: tests/run_vulkan_qa.sh ./custom-editor/godot.linuxbsd.editor.x86_64

      - name: Check the engine module loaded
        run: grep -qF "[Prism RP] engine module loaded" godot_vulkan_qa.log

      - name: Check the Track B line (off by default)
        run: |
          grep -qF "[Prism RP] Track B: off (setting) | GPU path:" godot_vulkan_qa.log

      # The Track B hook returns the stock renderer for now, so the scenes must come out the same,
      # with the same baseline comparison and no new validation findings.
      - name: Boot every benchmark scene again with Track B on auto
        env:
          QA_RIG_ARGS: "--prism-trackb=auto"
        run: |
          mkdir track-b-off
          mv godot_*.log track-b-off/
          tests/run_vulkan_qa.sh ./custom-editor/godot.linuxbsd.editor.x86_64
          grep -qF "[Prism RP] Track B: auto (command line) | GPU path:" godot_vulkan_qa.log
          mv track-b-off/godot_vulkan_qa.log godot_track_b_off.log

      - name: Upload Vulkan QA log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-godot-vulkan-qa-log
          path: godot_*.log

  indirect-count:
    name: Indirect-count draw test (lavapipe)
    needs: linux-editor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the custom editor
        uses: actions/download-artifact@v4
        with:
          name: prism-godot-linux-editor
          path: custom-editor

      - name: Install Mesa Lavapipe, Khronos Validation Layers and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers xvfb
          chmod +x custom-editor/godot.linuxbsd.editor.x86_64
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)" >> "$GITHUB_ENV"

      - name: Run the test
        run: tests/engine/run_indirect_count.sh ./custom-editor/godot.linuxbsd.editor.x86_64

  shade-materials:
    name: Track B material shading dispatch (lavapipe)
    needs: linux-editor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the custom editor
        uses: actions/download-artifact@v4
        with:
          name: prism-godot-linux-editor
          path: custom-editor

      - name: Install Mesa Lavapipe, Khronos Validation Layers and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers xvfb
          chmod +x custom-editor/godot.linuxbsd.editor.x86_64
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)" >> "$GITHUB_ENV"

      - name: Run the test
        run: tests/engine/run_shade_materials.sh ./custom-editor/godot.linuxbsd.editor.x86_64

  mesh-shader:
    name: Mesh and task shader test (lavapipe)
    needs: linux-editor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the custom editor
        uses: actions/download-artifact@v4
        with:
          name: prism-godot-linux-editor
          path: custom-editor

      - name: Install Mesa Lavapipe, Khronos Validation Layers, Xvfb and vulkaninfo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb
          chmod +x custom-editor/godot.linuxbsd.editor.x86_64
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)" >> "$GITHUB_ENV"

      # Lavapipe gained VK_EXT_mesh_shader in Mesa 25.1; fail with a clear reason on an older runner image.
      - name: Check that this lavapipe has mesh shaders
        run: |
          apt-cache policy mesa-vulkan-drivers | head -n 3
          vulkaninfo --summary | grep -E "driverInfo|apiVersion"
          vulkaninfo | grep -q VK_EXT_mesh_shader || { echo "::error::This Mesa's lavapipe has no VK_EXT_mesh_shader."; exit 1; }

      - name: Run the test
        run: tests/engine/run_mesh_shader.sh ./custom-editor/godot.linuxbsd.editor.x86_64

  track-b:
    name: Track B switch (lavapipe)
    needs: linux-editor
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the custom editor
        uses: actions/download-artifact@v4
        with:
          name: prism-godot-linux-editor
          path: custom-editor

      - name: Install Mesa Lavapipe, Xvfb and vulkaninfo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools xvfb
          chmod +x custom-editor/godot.linuxbsd.editor.x86_64
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)" >> "$GITHUB_ENV"

      # The test expects the mesh GPU path, which needs a lavapipe with VK_EXT_mesh_shader (Mesa 25.1 or newer).
      - name: Check that this lavapipe has mesh shaders
        run: vulkaninfo | grep -q VK_EXT_mesh_shader || { echo "::error::This Mesa's lavapipe has no VK_EXT_mesh_shader."; exit 1; }

      - name: Run the test
        run: tests/engine/run_track_b.sh ./custom-editor/godot.linuxbsd.editor.x86_64
